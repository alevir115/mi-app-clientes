<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes - Producción</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 border-b-2 border-blue-500 pb-2">Sistema de Gestión de Clientes</h1>
        
        <div class="bg-white p-6 rounded-lg shadow-lg mb-6 grid grid-cols-1 md:grid-cols-2 gap-4">
            <h2 class="col-span-full text-lg font-semibold text-blue-700">Registrar Nuevo Cliente</h2>
            <input type="text" id="nombre" placeholder="Nombre" class="border p-2 rounded focus:border-blue-500 outline-none">
            <input type="text" id="apellido" placeholder="Apellido" class="border p-2 rounded focus:border-blue-500 outline-none">
            <input type="text" id="dni" placeholder="DNI" class="border p-2 rounded focus:border-blue-500 outline-none">
            <input type="number" id="telefono" placeholder="Teléfono" class="border p-2 rounded focus:border-blue-500 outline-none">
            <input type="text" id="cuit" placeholder="CUIT" class="border p-2 rounded focus:border-blue-500 outline-none">
            <input type="text" id="domicilio" placeholder="Domicilio completo" class="border p-2 rounded md:col-span-2 focus:border-blue-500 outline-none">
            <button onclick="agregarCliente()" class="bg-blue-600 text-white p-3 rounded md:col-span-2 hover:bg-blue-700 font-bold transition duration-200 shadow-md">
                💾 Guardar en Base de Datos
            </button>
        </div>

        <div class="bg-gray-800 p-4 rounded-lg mb-6 shadow-inner">
            <div class="flex items-center justify-between">
                <span class="text-gray-300 text-xs font-mono">Consola de Estado del Servidor</span>
                <button onclick="diagnostico()" class="bg-yellow-500 text-gray-900 px-3 py-1 rounded text-xs font-bold hover:bg-yellow-400">
                    EJECUTAR DIAGNÓSTICO
                </button>
            </div>
            <div id="debug-log" class="mt-2 text-xs font-mono text-green-400 max-h-32 overflow-y-auto">
                > Sistema listo. Presione el botón amarillo para testear conexión.
            </div>
        </div>

        <div class="mb-6">
            <input type="text" id="buscador" oninput="buscarClientes()" placeholder="🔍 Buscar por DNI, Nombre o CUIT..." 
                   class="w-full p-4 border-2 border-gray-200 rounded-xl shadow-sm focus:border-blue-400 outline-none">
        </div>

        <div class="bg-white rounded-xl shadow-xl overflow-hidden border border-gray-200">
            <table class="w-full text-left">
                <thead class="bg-gray-100 text-gray-700">
                    <tr>
                        <th class="p-4 border-b">Datos del Cliente</th>
                        <th class="p-4 border-b text-center">DNI / CUIT</th>
                        <th class="p-4 border-b text-right">Acciones</th>
                    </tr>
                </thead>
                <tbody id="listaClientes" class="divide-y divide-gray-100">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN CRÍTICA ---
        const SUPABASE_URL = 'https://uabddcmlpmomffdrpavg.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ5dGtyd250Zm14bm5qZWRzZmlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNzU5NzEsImV4cCI6MjA5Mjg1MTk3MX0.mH7H0ZzoYHArewRZEgLRWp3Q_8ubAHMgA7VkekT5Kps';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // FUNCIÓN: CARGAR CLIENTES
        async function cargarClientes() {
            const { data, error } = await _supabase
                .from('clientes') // Nombre de la tabla verificado
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) {
                document.getElementById('debug-log').innerHTML += `<br>❌ Error carga: ${error.message}`;
            }
            renderizar(data || []);
        }

        // FUNCIÓN: AGREGAR
        async function agregarCliente() {
            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = "Procesando...";

            const cliente = {
                nombre: document.getElementById('nombre').value.trim(),
                apellido: document.getElementById('apellido').value.trim(),
                dni: document.getElementById('dni').value.trim(),
                telefono: parseInt(document.getElementById('telefono').value) || 0,
                cuit: document.getElementById('cuit').value.trim(),
                domicilio: document.getElementById('domicilio').value.trim()
            };

            if (!cliente.nombre || !cliente.dni) {
                btn.disabled = false;
                btn.innerHTML = "💾 Guardar en Base de Datos";
                return alert("Faltan datos obligatorios (Nombre y DNI)");
            }

            const { error } = await _supabase.from('clientes').insert([cliente]);
            
            if (error) {
                alert("Error de Supabase: " + error.message);
            } else {
                alert("¡Cliente guardado correctamente!");
                document.querySelectorAll('input:not(#buscador)').forEach(i => i.value = '');
                cargarClientes();
            }
            btn.disabled = false;
            btn.innerHTML = "💾 Guardar en Base de Datos";
        }

        // FUNCIÓN: BUSCAR
        async function buscarClientes() {
            const term = document.getElementById('buscador').value;
            if (!term) return cargarClientes();

            const { data } = await _supabase.from('clientes')
                .select('*')
                .or(`nombre.ilike.%${term}%,dni.ilike.%${term}%,cuit.ilike.%${term}%`);
            
            renderizar(data || []);
        }

        // FUNCIÓN: ELIMINAR
        async function eliminarCliente(id) {
            if(confirm("¿Seguro que querés borrar este cliente?")) {
                const { error } = await _supabase.from('clientes').delete().eq('id', id);
                if (error) alert("Error al borrar");
                cargarClientes();
            }
        }

        // FUNCIÓN: DIBUJAR TABLA
        function renderizar(clientes) {
            const lista = document.getElementById('listaClientes');
            if (clientes.length === 0) {
                lista.innerHTML = '<tr><td colspan="3" class="p-10 text-center text-gray-400 italic">No hay clientes registrados en la tabla "clientes"</td></tr>';
                return;
            }
            lista.innerHTML = clientes.map(c => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="p-4 text-sm text-gray-800">
                        <div class="font-bold uppercase text-blue-800">${c.nombre} ${c.apellido}</div>
                        <div class="text-xs text-gray-500">Tel: ${c.telefono} | Domicilio: ${c.domicilio || 'N/A'}</div>
                    </td>
                    <td class="p-4 text-center text-sm font-mono text-gray-600">
                        DNI: ${c.dni}<br>CUIT: ${c.cuit || '-'}
                    </td>
                    <td class="p-4 text-right">
                        <button onclick="eliminarCliente(${c.id})" class="text-red-500 text-xs font-bold hover:underline">
                            ELIMINAR
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // FUNCIÓN: DIAGNÓSTICO
        async function diagnostico() {
            const log = document.getElementById('debug-log');
            log.innerHTML = "> Testeando llaves...<br>";
            
            if (SUPABASE_KEY.length < 50) {
                log.innerHTML += "❌ ERROR: No pegaste la clave larga de Supabase.<br>";
                return;
            }
            
            log.innerHTML += "> Conectando a la tabla 'clientes'...<br>";
            const { error, status } = await _supabase.from('clientes').select('id').limit(1);
            
            if (error) {
                log.innerHTML += `❌ ERROR ${status}: ${error.message}<br>`;
                log.innerHTML += `💡 REVISIÓN: ¿La tabla se llama exactamente 'clientes'? ¿Desactivaste el RLS?`;
            } else {
                log.innerHTML += `✅ ¡TODO OK! Tabla detectada y accesible (Status ${status})`;
            }
        }

        // Iniciar
        cargarClientes();
    </script>
</body>
</html>
