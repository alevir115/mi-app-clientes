<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Administrador de Clientes</h1>
        
        <div class="bg-white p-6 rounded-lg shadow-md mb-8 grid grid-cols-2 gap-4">
            <input type="text" id="nombre" placeholder="Nombre (Letras)" class="border p-2 rounded">
            <input type="text" id="apellido" placeholder="Apellido (Letras)" class="border p-2 rounded">
            <input type="text" id="dni" placeholder="DNI" class="border p-2 rounded">
            <input type="number" id="telefono" placeholder="Teléfono" class="border p-2 rounded">
            <input type="text" id="cuit" placeholder="CUIT" class="border p-2 rounded">
            <input type="text" id="domicilio" placeholder="Domicilio" class="border p-2 rounded col-span-2">
            <button onclick="agregarCliente()" class="bg-blue-600 text-white p-2 rounded col-span-2 hover:bg-blue-700 transition">Guardar Cliente</button>
        </div>

        <input type="text" id="buscador" oninput="buscarClientes()" placeholder="🔍 Buscar por DNI, Nombre o CUIT..." class="w-full p-3 border rounded-lg mb-6 shadow-sm">

        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="p-4">Cliente</th><th class="p-4">DNI</th><th class="p-4">CUIT</th><th class="p-4">Acciones</th>
                    </tr>
                </thead>
                <tbody id="listaClientes"></tbody>
            </table>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE CREDENCIALES
        const SUPABASE_URL = 'https://uabddcmlpmomffdrpavg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhYmRkY21scG1vbWZmZHJwYXZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NzA1ODQsImV4cCI6MjA5MzQ0NjU4NH0.bnLf5TdKW8sOIadm4LU0SZlMbQgQOzp_q3l03KLnVbw';
        
        // Inicialización correcta del cliente
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function cargarClientes() {
            const { data, error } = await _supabase
                .from('clientes')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) {
                console.error("Error cargando:", error);
                return;
            }
            renderizar(data);
        }

        async function agregarCliente() {
            const cliente = {
                nombre: document.getElementById('nombre').value,
                apellido: document.getElementById('apellido').value,
                dni: document.getElementById('dni').value,
                telefono: parseInt(document.getElementById('telefono').value),
                cuit: document.getElementById('cuit').value,
                domicilio: document.getElementById('domicilio').value
            };

            // Validación básica
            if (!cliente.nombre || !cliente.apellido || !cliente.dni) {
                return alert("Por favor, completa los campos obligatorios (Nombre, Apellido y DNI)");
            }

            const { error } = await _supabase.from('clientes').insert([cliente]);
            
            if (error) {
                alert("Error al guardar: " + error.message);
                console.error(error);
            } else {
                // Limpiar campos y recargar
                document.querySelectorAll('input').forEach(i => i.value = '');
                cargarClientes();
                alert("Cliente guardado con éxito");
            }
        }

        async function eliminarCliente(id) {
            if(confirm("¿Eliminar este cliente?")) {
                const { error } = await _supabase.from('clientes').delete().eq('id', id);
                if (error) alert("Error al eliminar");
                cargarClientes();
            }
        }

        async function buscarClientes() {
            const term = document.getElementById('buscador').value;
            if (!term) {
                cargarClientes();
                return;
            }
            const { data } = await _supabase.from('clientes').select('*')
                .or(`nombre.ilike.%${term}%,dni.ilike.%${term}%,cuit.ilike.%${term}%`);
            renderizar(data);
        }

        function renderizar(clientes) {
            const lista = document.getElementById('listaClientes');
            if (!clientes || clientes.length === 0) {
                lista.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">No hay clientes registrados</td></tr>';
                return;
            }
            lista.innerHTML = clientes.map(c => `
                <tr class="border-t">
                    <td class="p-4"><strong>${c.nombre} ${c.apellido}</strong><br><span class="text-sm text-gray-500">${c.telefono || ''}</span></td>
                    <td class="p-4">${c.dni}</td>
                    <td class="p-4">${c.cuit}</td>
                    <td class="p-4"><button onclick="eliminarCliente(${c.id})" class="text-red-500 hover:underline">Eliminar</button></td>
                </tr>
            `).join('');
        }

        // Carga inicial
        cargarClientes();
    </script>
</body>
</html>
